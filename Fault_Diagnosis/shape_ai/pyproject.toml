[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-ai"
version = "0.1.0"
description = "Leakage-safe HDF5 training and evaluation pipeline for the Kinova SHAPE benchmark"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
shape-index = "shape_ai.indexing:main"
shape-preflight = "shape_ai.preflight:main"
shape-benchmark = "shape_ai.benchmark:main"
shape-train = "shape_ai.train:main"
shape-evaluate = "shape_ai.evaluate:main"
shape-analyze = "shape_ai.analysis:main"
shape-compare = "shape_ai.compare:main"
shape-aggregate = "shape_ai.aggregate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
